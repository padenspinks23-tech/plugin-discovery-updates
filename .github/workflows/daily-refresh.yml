name: Proposed daily public catalog refresh
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-catalog-refresh
  cancel-in-progress: false
jobs:
  gated-readiness:
    # OFF unless the owner has specifically authorized all source/publish gates.
    if: vars.PUBLIC_CATALOG_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests
      - name: Fail closed until authorized implementation exists
        run: python3 scripts/check_release.py --config config/release.json
